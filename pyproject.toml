[project]
name = "fantasy-football-analysis"
version = "0.1.0"
description = "Fantasy football analysis application"
requires-python = ">=3.10"
dependencies = [
    "nflreadpy>=0.1.5",
    "pandas>=2.0.0",
    "psycopg[binary]",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "ruff>=0.15.1",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["backend"]
exclude = ["^backend/tests/"]
ignore_missing_imports = true
