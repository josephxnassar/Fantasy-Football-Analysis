[project]
name = "fantasy-football-analysis"
version = "0.2.0"
description = "Fantasy football analysis application"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "nflreadpy",
    "pandas",
    "pyarrow",
    "psycopg[binary]",
    "pydantic",
    "python-dotenv",
    "uvicorn",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E302", "E305", "E501"]

[tool.mypy]
python_version = "3.10"
files = ["backend"]
exclude = ["^backend/tests/"]
ignore_missing_imports = true
